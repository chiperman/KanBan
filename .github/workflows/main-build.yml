name: Build main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-build
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Verify and build main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KANBAN_CI_HOME: .ci-run
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Verify and build
        run: pnpm ci:verify

      - name: Write build metadata
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF_NAME" --arg run "$GITHUB_RUN_ID" \
            '{sha:$sha,ref:$ref,run_id:$run,kind:"main-build"}' > "$RUNNER_TEMP/kanban-build.json"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: main-evidence-${{ github.run_id }}
          path: .ci-run
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kanban-main-build-${{ github.sha }}
          path: ${{ runner.temp }}/kanban-build.json
          retention-days: 30
