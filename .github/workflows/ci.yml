name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# New PR commits replace old checks. Each main push has its own group so that
# neither running nor pending verification is replaced by a later commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, design lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      KANBAN_CI_HOME: .ci-run
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check application version and changelog
        run: node scripts/release.mjs

      - name: Select verification scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Setup pnpm
        if: steps.scope.outputs.app == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        if: steps.scope.outputs.app == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Verify and build application
        if: steps.scope.outputs.app == 'true'
        run: pnpm ci:verify

      - name: Explain reduced verification
        if: steps.scope.outputs.app != 'true'
        run: echo "Only documentation or landing content changed; application verification is not required."

      - name: Write main build metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF_NAME" --arg run "$GITHUB_RUN_ID" \
            '{sha:$sha,ref:$ref,run_id:$run,kind:"main-build"}' > "$RUNNER_TEMP/kanban-build.json"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-${{ github.run_id }}
          path: .ci-run
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload main build metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kanban-main-build-${{ github.sha }}
          path: ${{ runner.temp }}/kanban-build.json
          retention-days: 30
