name: Build and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy Mac mini runtime
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macos, arm64, kanban-deploy]
    environment:
      name: production
    timeout-minutes: 60
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      KANBAN_CI_HOME: ${{ github.workspace }}/.ci-run
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Verify exact main commit
        run: pnpm ci:local verify "$GITHUB_WORKSPACE"

      - name: Update the isolated production runtime
        run: pnpm runtime:update
