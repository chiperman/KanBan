name: Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, design lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      KANBAN_CI_HOME: ${{ github.workspace }}/.ci-run
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Verify repository
        run: pnpm ci:local verify "$GITHUB_WORKSPACE"

      - name: Upload verification evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence-${{ github.run_id }}
          path: ${{ github.workspace }}/.ci-run
          if-no-files-found: ignore
          retention-days: 7
