name: Publish integration plugins

on:
  push:
    tags: ['plugins-v*']

permissions:
  contents: read

concurrency:
  group: plugin-release
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - name: Build and verify portable plugin release
        env:
          KANBAN_PLUGIN_REPOSITORY: ${{ github.repository }}
        run: pnpm plugins:verify --release "$GITHUB_REF_NAME" --output dist/plugins/release
      - name: Check main CI and published versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-transform-types scripts/check-plugin-release.mjs
      - name: Save verified release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-release-${{ github.sha }}
          path: dist/plugins/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
      - name: Download verified release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-release-${{ github.sha }}
          path: dist/plugins/release/
      - name: Resume draft, verify uploads and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-transform-types scripts/publish-plugin-release.mjs
