[package]
name = "kanban-longbridge-keychain-sdk"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
time = "0.3"
keyring = { version = "3.6.2", features = ["apple-native"] }
longbridge = "5.3.0"
longbridge-oauth = "4.4.1"
napi = { version = "3.11.0", default-features = false, features = ["dyn-symbols", "napi8", "tokio_rt"] }
napi-derive = "3.6.0"
oauth2 = { version = "4.4.2", default-features = false, features = ["reqwest", "native-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }

[patch.crates-io]
longbridge-oauth = { path = "vendor/longbridge-oauth" }
